
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 30px 15px;
        }

        #app {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        #taskInput {
            width: 70%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 12px;
            margin: 3px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #addBtn {
            background: #333;
            color: white;
        }

        #taskList {
            list-style: none;
            padding: 0;
        }

        #taskList li {
            display: flex;
            align-items: center;
            gap: 5px;
            margin: 10px 0;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        #taskList li span {
            flex: 1;
        }

        #counter {
            font-weight: bold;
        }

        @media (max-width: 500px) {
            #taskInput {
                width: 100%;
                margin-bottom: 8px;
            }

            #taskList li {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

<div id="app">
    <h2>Task Manager</h2>

    <div>
        <input type="text" id="taskInput" placeholder="New task...">
        <button id="addBtn">Add</button>
    </div>

    <div>
        <button id="showAllBtn">All</button>
        <button id="showActiveBtn">Active</button>
        <button id="showDoneBtn">Done</button>
    </div>

    <ul id="taskList"></ul>

    <div>
        <span id="counter"></span>
        <button id="clearDoneBtn">Clear Done</button>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
